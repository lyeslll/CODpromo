<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <!-- منع اقتراح ترجمة Google Chrome -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- PWA: رابط الـmanifest يُحقن تلقائياً بواسطة vite-plugin-pwa عند البناء -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS standalone (للتثبيت على آيفون لاحقاً) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CODpromo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>CODpromo | أكواد برومو لتجّار الدفع عند الاستلام</title>
    <meta
      name="description"
      content="أكواد خصم وكوبونات وكاش باك على التوصيل ومنصات المتاجر والإعلانات وبطاقات الدفع وERP، لتجّار الدفع عند الاستلام في الجزائر والعالم العربي. مجاناً، وكل كود يُراجَع يدوياً، وPremium مدى الحياة بدفعة واحدة."
    />

    <!-- Tajawal (العربية) + Inter (English / Français): من الموقع نفسه (src/assets/fonts/fonts.css).
         preload غير للخطين اللي يبانو في أول شاشة بالعربية (العنوان 900 + الأزرار 700، ~9KB لكل واحد). -->
    <link rel="preload" href="/fonts/tajawal-v12-arabic-900.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/tajawal-v12-arabic-700.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Anti-flash: الموقع داكن فقط + اللغة/الاتجاه قبل أول رسم -->
    <script>
      (function () {
        // تنظيف اختيار الثيم القديم (لم يعد هناك وضع فاتح)
        try {
          localStorage.removeItem("codpromo:theme");
        } catch (e) {}
        // اللغة + الاتجاه قبل أول رسم لتفادي وميض RTL/LTR
        try {
          var l = localStorage.getItem("codpromo:lang");
          if (l !== "ar" && l !== "en" && l !== "fr") l = "ar";
          document.documentElement.setAttribute("lang", l);
          document.documentElement.setAttribute("dir", l === "ar" ? "rtl" : "ltr");
        } catch (e) {
          document.documentElement.setAttribute("lang", "ar");
          document.documentElement.setAttribute("dir", "rtl");
        }
      })();
    </script>

    <style>
      /* خلفية داكنة حرجة حتى لا يحدث وميض قبل تحميل CSS/React */
      html {
        color-scheme: dark;
      }
      html,
      body,
      #root {
        background: #0a0a0a;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #boot.hide {
        opacity: 0;
        pointer-events: none;
      }
      .boot-ring {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 3px solid #1c1c20;
        border-top-color: #a6f000;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <!-- Google Search Console — التحقق من ملكية الموقع (HTML ثابت) -->
    <meta name="google-site-verification" content="c334FOLQkAdbg6LrahEPlz3-gkNflM3RuS0S5lQ497Q" />
  </head>
  <body>
    <div id="boot"><div class="boot-ring"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
