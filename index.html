<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- PWA: رابط الـmanifest يُحقن تلقائياً بواسطة vite-plugin-pwa عند البناء -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS standalone (للتثبيت على آيفون لاحقاً) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CODpromo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>CODpromo · أكواد الخصم والكوبونات والكاش باك</title>
    <meta
      name="description"
      content="CODpromo — أكبر منصة عربية لأكواد الخصم والبرومو والكاش باك لمتاجر التجارة الإلكترونية في الجزائر والعالم العربي."
    />

    <!-- Tajawal (العربية) + Inter (English / Français) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Anti-flash: apply saved theme to <html> before first paint -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("codpromo:theme");
          if (t !== "light" && t !== "dark") t = "dark";
          document.documentElement.classList.add(t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
        // اللغة + الاتجاه قبل أول رسم لتفادي وميض RTL/LTR
        try {
          var l = localStorage.getItem("codpromo:lang");
          if (l !== "ar" && l !== "en" && l !== "fr") l = "ar";
          document.documentElement.setAttribute("lang", l);
          document.documentElement.setAttribute("dir", l === "ar" ? "rtl" : "ltr");
        } catch (e) {
          document.documentElement.setAttribute("lang", "ar");
          document.documentElement.setAttribute("dir", "rtl");
        }
      })();
    </script>

    <style>
      /* Critical theme backgrounds so there is no flash before CSS/React load */
      html.dark { --boot-bg: #0a0a0a; }
      html.light { --boot-bg: #f4f6ef; }
      html,
      body,
      #root {
        background: var(--boot-bg, #0a0a0a);
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--boot-bg, #0a0a0a);
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #boot.hide {
        opacity: 0;
        pointer-events: none;
      }
      .boot-ring {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 3px solid #1c1c20;
        border-top-color: #a6f000;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <!-- Google Search Console — التحقق من ملكية الموقع (HTML ثابت) -->
    <meta name="google-site-verification" content="c334FOLQkAdbg6LrahEPlz3-gkNflM3RuS0S5lQ497Q" />
  </head>
  <body>
    <div id="boot"><div class="boot-ring"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
